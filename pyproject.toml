[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "updown-desk"
version = "0.1.0"
description = "Lossless recorder and fair-value replay desk for Polymarket 15-minute crypto Up/Down markets"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client>=0.9",
    "websockets>=13",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
updown-collect = "updown.collector:main"
updown-report = "updown.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
